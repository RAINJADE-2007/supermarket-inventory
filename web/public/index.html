<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>超市库存工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script defer src="runtime.js"></script>
  <script defer src="sample.js"></script>
  <script defer src="api.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#" class="brand" aria-label="超市库存工作台首页">
      <span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i></span>
      <span><strong>库存工作台</strong><small>超市商品管理</small></span>
    </a>
    <nav aria-label="库存页面">
      <button type="button" data-page="inventory" aria-current="page"><i class="nav-icon grid-icon" aria-hidden="true"></i>库存总览</button>
      <button type="button" data-page="alerts"><i class="nav-icon bell-icon" aria-hidden="true"></i>低库存预警<span id="nav-alerts" class="nav-badge">1</span></button>
      <button type="button" data-page="categories"><i class="nav-icon chart-icon" aria-hidden="true"></i>分类统计</button>
    </nav>
    <div class="sidebar-footer"><span class="online-dot" aria-hidden="true"></span><span id="server-label">静态演示</span></div>
  </aside>

  <main>
    <div class="topbar">
      <span class="crumb">超市商品管理</span>
      <div class="actions top-actions">
        <button type="button" class="button quiet" data-open="data">数据文件</button>
        <button type="button" class="button primary" data-open="add"><span aria-hidden="true">＋</span> 新增商品</button>
      </div>
    </div>

    <div class="workspace">
      <header class="title-row">
        <div><h1 id="main-title">库存总览</h1><p id="subtitle">查看商品库存、预警和库存总值。</p></div>
        <div class="mode-switch" role="group" aria-label="数据来源">
          <button type="button" data-mode="preview" aria-pressed="true">示例预览</button>
          <button type="button" data-mode="live" aria-pressed="false">C++ 工作区</button>
        </div>
      </header>

      <div class="notice" id="mode-note"><b>示例数据</b><span>以下为随项目提供的示例，可筛选和排序。切换到 C++ 工作区可验证业务接口。</span></div>
      <p id="status" class="operation-status" role="status" hidden></p>

      <section class="metrics" id="metrics" aria-label="库存指标">
        <article class="metric"><div><h2>商品种类</h2><strong id="metric-kinds">3</strong><small> 种</small></div><i class="metric-icon grid-icon" aria-hidden="true"></i></article>
        <article class="metric"><div><h2>总库存</h2><strong id="metric-stock">78</strong><small> 件</small></div><i class="metric-icon box-icon" aria-hidden="true"></i></article>
        <article class="metric"><div><h2>库存总值</h2><strong id="metric-value">¥450.00</strong></div><span class="metric-token" aria-hidden="true">¥</span></article>
        <article class="metric warning-metric"><div><h2>低库存商品</h2><strong id="metric-alerts">1</strong><small> 种</small></div><i class="metric-icon bell-icon" aria-hidden="true"></i></article>
      </section>

      <div class="workspace-grid" id="workspace-grid">
        <section class="panel catalog" id="catalog" aria-labelledby="catalog-title">
          <header class="panel-heading">
            <div><h2 id="catalog-title">商品清单</h2><p id="table-description">按商品编号、名称或类别筛选。</p></div>
            <span id="row-count" class="count">3 条</span>
          </header>
          <form class="toolbar" id="query-form">
            <select id="query-kind" aria-label="查询字段">
              <option value="name">名称</option><option value="id">编号</option><option value="category">类别</option>
            </select>
            <input id="query-text" type="search" placeholder="搜索商品" aria-label="搜索商品">
            <button type="submit" class="button quiet">查询</button>
            <select id="sort" aria-label="排序">
              <option value="">默认排序</option>
              <option value="price:asc">单价升序</option><option value="price:desc">单价降序</option>
              <option value="stock:asc">库存升序</option><option value="stock:desc">库存降序</option>
            </select>
          </form>
          <div id="table-wrap" class="table-wrap">
            <table>
              <caption class="sr-only" id="table-caption">库存商品明细</caption>
              <thead><tr><th scope="col">商品</th><th scope="col">类别</th><th scope="col">单价</th><th scope="col">库存</th><th scope="col">状态</th><th scope="col"><span class="sr-only">操作</span></th></tr></thead>
              <tbody id="product-rows"></tbody>
            </table>
          </div>
          <p class="empty" id="empty-table" hidden></p>
          <footer class="panel-footer"><span id="table-footer">显示 3 条记录</span><button type="button" class="text-button" data-open="stockIn">出入库操作</button></footer>
        </section>

        <section class="panel categories" id="categories" aria-labelledby="chart-title">
          <header class="panel-heading"><div><h2 id="chart-title">库存分布</h2><p>各类别库存数量</p></div></header>
          <div class="chart-body" id="category-bars"></div>
          <p class="empty" id="empty-chart" hidden></p>
          <div class="category-detail" id="category-detail" hidden>
            <table>
              <caption class="sr-only">分类库存统计</caption>
              <thead><tr><th scope="col">类别</th><th scope="col">商品种类</th><th scope="col">库存数量</th><th scope="col">库存总值</th></tr></thead>
              <tbody id="category-rows"></tbody>
            </table>
          </div>
          <footer class="panel-footer" id="chart-footer"><button data-page="categories" type="button" class="text-button">查看分类统计</button></footer>
        </section>
      </div>
    </div>
  </main>

  <dialog id="operation-dialog" aria-labelledby="dialog-title">
    <form id="operation-form">
      <header class="dialog-heading">
        <div><h2 id="dialog-title"></h2><p id="dialog-description"></p></div>
        <button type="button" id="close-dialog" class="icon-button" aria-label="关闭">×</button>
      </header>
      <div class="dialog-fields" id="dialog-fields"></div>
      <p class="operation-status" id="dialog-status" role="status" hidden></p>
      <footer class="dialog-actions">
        <button type="button" class="button quiet" id="cancel-dialog">关闭</button>
        <button type="submit" class="button primary" id="submit-action">提交</button>
      </footer>
    </form>
  </dialog>
</body>
</html>
